<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Debugger</title>
    <style>
        body { font-family: monospace; padding: 10px; margin: 0; }
        fieldset { margin-bottom: 20px; }
        button { padding: 10px; margin-top: 10px; display: block; width: 100%; }
        input, select { padding: 8px; margin: 5px 0; width: 90%; box-sizing: border-box; }
        #log { background: #eee; padding: 10px; min-height: 40px; margin-bottom: 20px; word-wrap: break-word;}
    </style>
</head>
<body>
    <h2>NFC Debug Console</h2>
    
    <div id="log">Status: Idle</div>

    <fieldset>
        <legend>Pump Test</legend>
        <label>Direction:</label>
        <select id="pump_dir">
            <option value="1">Forward (1)</option>
            <option value="2">Reverse (2)</option>
            <option value="0">Coast (0)</option>
            <option value="3">Brake (3)</option>
        </select>
        <label>Speed (0-100%):</label>
        <input type="number" id="pump_spd" value="50" min="0" max="100">
        <label>Duration (Seconds):</label>
        <input type="number" id="pump_sec" value="5" min="0">
        <button onclick="sendPumpCmd()">Write Pump Command</button>
    </fieldset>

    <fieldset>
        <legend>Solenoid Test</legend>
        <label>Zone:</label>
        <select id="sol_zone">
            <option value="A">Zone A</option>
            <option value="B">Zone B</option>
            <option value="C">Zone C</option>
            <option value="O">All Off</option>
        </select>
        <label>State:</label>
        <select id="sol_state">
            <option value="1">ON (Open)</option>
            <option value="0">OFF (Closed)</option>
        </select>
        <button onclick="sendSolCmd()">Write Solenoid Command</button>
    </fieldset>

    <fieldset>
        <legend>Device Metrics</legend>
        <button onclick="readMetrics()">Scan Tag for Metrics</button>
        <pre id="metrics_out">No data yet...</pre>
    </fieldset>

    <script>
        const logEl = document.getElementById('log');

        async function writeNFC(payload) {
            if (!("NDEFReader" in window)) {
                logEl.innerText = "Error: WebNFC not supported.";
                return;
            }
            try {
                const ndef = new NDEFReader();
                logEl.innerText = "Ready to write... Tap the tag!";
                await ndef.write({
                    records: [{ recordType: "text", data: JSON.stringify(payload) }]
                });
                logEl.innerText = "Success! Wrote: " + JSON.stringify(payload);
            } catch (err) {
                logEl.innerText = "Write failed: " + err;
            }
        }

        function sendPumpCmd() {
            const dir = parseInt(document.getElementById('pump_dir').value);
            const spd = parseInt(document.getElementById('pump_spd').value);
            const sec = parseInt(document.getElementById('pump_sec').value);
            writeNFC({ cmd: "pump", dir: dir, spd: spd, sec: sec });
        }

        function sendSolCmd() {
            const zone = document.getElementById('sol_zone').value;
            const state = parseInt(document.getElementById('sol_state').value);
            writeNFC({ cmd: "sol", zone: zone, state: state });
        }

        async function readMetrics() {
            if (!("NDEFReader" in window)) {
                logEl.innerText = "Error: WebNFC not supported.";
                return;
            }
            try {
                const ndef = new NDEFReader();
                logEl.innerText = "Ready to read... Tap the tag!";
                await ndef.scan();
                
                ndef.onreading = event => {
                    const decoder = new TextDecoder();
                    for (const record of event.message.records) {
                        if (record.recordType === "text") {
                            const data = decoder.decode(record.data);
                            document.getElementById('metrics_out').innerText = data;
                            logEl.innerText = "Read Successful!";
                        }
                    }
                };
            } catch (err) {
                logEl.innerText = "Read failed: " + err;
            }
        }
    </script>
</body>
</html>
