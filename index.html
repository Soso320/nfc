<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Debugger</title>
    <style>
        :root {
            --bg: #f4f4f5;
            --surface: #ffffff;
            --text-main: #18181b;
            --text-muted: #71717a;
            --border: #e4e4e7;
            --accent: #27272a;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
        }

        .container { 
            background: var(--surface); 
            width: 100%; 
            max-width: 420px; 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); 
        }

        h2 { 
            text-align: center; 
            font-size: 1.4rem; 
            font-weight: 600; 
            margin: 0 0 24px 0; 
        }

        .section { 
            margin-bottom: 24px; 
            padding-bottom: 24px; 
            border-bottom: 1px solid var(--border); 
        }

        .section:last-child { 
            border-bottom: none; 
            margin-bottom: 0; 
            padding-bottom: 0; 
        }

        .section h3 { 
            font-size: 1.05rem; 
            font-weight: 600; 
            margin: 0 0 16px 0; 
        }

        label { 
            display: block; 
            font-size: 0.85rem; 
            font-weight: 500; 
            color: var(--text-muted); 
            margin-bottom: 6px; 
        }

        select, input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 16px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-family: inherit; 
            font-size: 0.95rem; 
            background: #fafafa;
            appearance: none;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--surface);
        }

        button { 
            width: 100%; 
            background: var(--accent); 
            color: var(--surface); 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            font-size: 0.95rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: transform 0.1s, opacity 0.2s; 
        }

        button:active { 
            transform: scale(0.98); 
            opacity: 0.9;
        }

        .btn-outline { 
            background: transparent; 
            color: var(--accent); 
            border: 1px solid var(--border); 
            margin-bottom: 12px;
        }

        pre { 
            background: #fafafa; 
            padding: 12px; 
            border-radius: 8px; 
            overflow-x: auto; 
            font-size: 0.85rem; 
            border: 1px solid var(--border); 
            margin: 0;
            color: var(--text-muted);
        }

        /* Modal Overlay CSS */
        .modal-overlay { 
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(0,0,0,0.6); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
            opacity: 0; 
            transition: opacity 0.2s ease; 
        }

        .modal-overlay.active { 
            display: flex; 
            opacity: 1; 
        }

        .modal-content { 
            background: var(--surface); 
            padding: 32px 24px; 
            border-radius: 16px; 
            width: 80%; 
            max-width: 320px; 
            text-align: center; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
            transform: translateY(20px);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-icon { 
            font-size: 3rem; 
            margin-bottom: 16px; 
        }

        .modal-title { 
            font-size: 1.2rem; 
            font-weight: 600; 
            margin-bottom: 8px; 
        }

        .modal-text { 
            font-size: 0.95rem; 
            color: var(--text-muted); 
            margin-bottom: 24px; 
            line-height: 1.5; 
        }

        .modal-close { 
            background: #f4f4f5; 
            color: var(--text-main); 
            display: none; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Hardware Debugger</h2>

        <div class="section">
            <h3>Pump Control</h3>
            <label>Direction</label>
            <select id="pump_dir">
                <option value="1">Forward</option>
                <option value="2">Reverse</option>
                <option value="0">Coast</option>
                <option value="3">Active Brake</option>
            </select>
            
            <label>Speed (0-100%)</label>
            <input type="number" id="pump_spd" value="50" min="0" max="100">
            
            <label>Duration (Seconds)</label>
            <input type="number" id="pump_sec" value="5" min="0">
            
            <button onclick="sendPumpCmd()">Write Pump Command</button>
        </div>

        <div class="section">
            <h3>Solenoid Control</h3>
            <label>Target Zone</label>
            <select id="sol_zone">
                <option value="A">Zone A</option>
                <option value="B">Zone B</option>
                <option value="C">Zone C</option>
                <option value="O">All Off (Emergency)</option>
            </select>
            
            <label>Valve State</label>
            <select id="sol_state">
                <option value="1">Open (ON)</option>
                <option value="0">Closed (OFF)</option>
            </select>
            
            <button onclick="sendSolCmd()">Write Solenoid Command</button>
        </div>

        <div class="section">
            <h3>Live Metrics</h3>
            <button class="btn-outline" onclick="readMetrics()">Scan Tag for Metrics</button>
            <pre id="metrics_out">Waiting for scan...</pre>
        </div>
    </div>

    <!-- Custom Popup Modal -->
    <div class="modal-overlay" id="nfcModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">📱</div>
            <div class="modal-title" id="modalTitle">Ready to Scan</div>
            <div class="modal-text" id="modalText">Hold your phone near the STM32 board.</div>
            <button class="modal-close" id="modalCloseBtn" onclick="hideModal()">Dismiss</button>
        </div>
    </div>

    <script>
        let abortController = null;
        let timeoutTimer = null;

        // --- Modal Logic ---
        function showModal(title, text, icon, showClose = false) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            document.getElementById('modalIcon').innerText = icon;
            document.getElementById('modalCloseBtn').style.display = showClose ? 'block' : 'none';
            document.getElementById('nfcModal').classList.add('active');
        }

        function hideModal() {
            document.getElementById('nfcModal').classList.remove('active');
            // Cancel any pending NFC operation when modal closes
            if (abortController) {
                abortController.abort();
                abortController = null;
            }
            if (timeoutTimer) {
                clearTimeout(timeoutTimer);
                timeoutTimer = null;
            }
        }

        // --- NFC Write Engine ---
        async function writeNFC(payload) {
            if (!("NDEFReader" in window)) {
                showModal("Not Supported", "WebNFC is only available on Chrome for Android.", "🚫", true);
                return;
            }

            abortController = new AbortController();
            showModal("Ready to Write", "Hold your phone near the tag...", "📡", false);
            
            // 8-second manual timeout
            timeoutTimer = setTimeout(() => {
                if (abortController) {
                    abortController.abort();
                    showModal("Timeout", "No tag detected. Ensure the phone is close enough.", "⏱️", true);
                }
            }, 8000);

            try {
                const ndef = new NDEFReader();
                await ndef.write({
                    records: [{ recordType: "text", data: JSON.stringify(payload) }]
                }, { signal: abortController.signal });
                
                clearTimeout(timeoutTimer);
                showModal("Success", "Command written to hardware successfully.", "✅", false);
                
                // Auto-close modal on success
                setTimeout(hideModal, 1500);
            } catch (err) {
                clearTimeout(timeoutTimer);
                if (err.name !== 'AbortError') {
                    showModal("Error", "Write failed: " + err.message, "❌", true);
                }
            }
        }

        // --- Hardware Commands ---
        function sendPumpCmd() {
            const dir = parseInt(document.getElementById('pump_dir').value);
            const spd = parseInt(document.getElementById('pump_spd').value);
            const sec = parseInt(document.getElementById('pump_sec').value);
            writeNFC({ cmd: "pump", dir: dir, spd: spd, sec: sec });
        }

        function sendSolCmd() {
            const zone = document.getElementById('sol_zone').value;
            const state = parseInt(document.getElementById('sol_state').value);
            writeNFC({ cmd: "sol", zone: zone, state: state });
        }

        // --- NFC Read Engine ---
        async function readMetrics() {
            if (!("NDEFReader" in window)) {
                showModal("Not Supported", "WebNFC is only available on Chrome for Android.", "🚫", true);
                return;
            }

            abortController = new AbortController();
            showModal("Ready to Read", "Hold your phone near the tag...", "📡", false);

            timeoutTimer = setTimeout(() => {
                if (abortController) {
                    abortController.abort();
                    showModal("Timeout", "No tag detected.", "⏱️", true);
                }
            }, 8000);

            try {
                const ndef = new NDEFReader();
                
                // scan() resolves immediately when reading starts, onreading fires when data arrives
                await ndef.scan({ signal: abortController.signal }); 
                
                ndef.onreading = event => {
                    clearTimeout(timeoutTimer);
                    const decoder = new TextDecoder();
                    for (const record of event.message.records) {
                        if (record.recordType === "text") {
                            let rawText = decoder.decode(record.data);
                            
                            // Attempt to pretty-print if it's JSON
                            try {
                                const jsonObj = JSON.parse(rawText);
                                rawText = JSON.stringify(jsonObj, null, 2);
                            } catch (e) {}

                            document.getElementById('metrics_out').innerText = rawText;
                            showModal("Metrics Read", "Data retrieved successfully.", "✅", false);
                            setTimeout(hideModal, 1200);
                        }
                    }
                };
            } catch (err) {
                clearTimeout(timeoutTimer);
                if (err.name !== 'AbortError') {
                    showModal("Error", "Read failed: " + err.message, "❌", true);
                }
            }
        }
    </script>
</body>
</html>
